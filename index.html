<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Xitoycha — Xitoy tovarlari do‘koni</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Onest:wght@400;500;600&display=swap">
<style>
:root{--bg:#F2F5F3;--surface:#fff;--ink:#14213D;--muted:#5B667A;--line:#D5DBE3;--tape:#FFC400;--tapeink:#14213D;--stamp:#D62F2F;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1626;--surface:#18223A;--ink:#EEF2F8;--muted:#9AA6BC;--line:#2B3856;--stamp:#FF6B6B;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F1626;--surface:#18223A;--ink:#EEF2F8;--muted:#9AA6BC;--line:#2B3856;--stamp:#FF6B6B;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 Onest,system-ui,sans-serif}
h1,h2,.logo{font-family:Unbounded,Onest,system-ui,sans-serif}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:3px solid var(--tape);outline-offset:2px}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:2px solid var(--ink)}
.logo{font-weight:800;font-size:18px}
.cartbtn{background:var(--ink);color:var(--bg);border:0;border-radius:999px;padding:9px 16px;font-weight:600}
.cartbtn b{background:var(--tape);color:var(--tapeink);border-radius:999px;padding:1px 8px;margin-left:6px}
.hero{padding:34px 18px 26px;max-width:880px;margin:0 auto}
.hero h1{font-size:clamp(28px,7vw,52px);line-height:1.08;margin:0 0 14px;font-weight:800}
.hero p{max-width:52ch;color:var(--muted);margin:0 0 20px}
.tape{display:inline-block;background:var(--tape);color:var(--tapeink);font-weight:600;padding:6px 12px;transform:rotate(-1.5deg)}
.stamps{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.stamp{border:2px solid var(--stamp);color:var(--stamp);padding:3px 10px;font-weight:600;font-size:14px;border-radius:4px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:0 18px 14px;max-width:880px;margin:0 auto}
.tab{white-space:nowrap;background:transparent;border:1.5px solid var(--ink);border-radius:999px;padding:7px 15px}
.tab[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;padding:0 18px 40px;max-width:880px;margin:0 auto}
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:6px;display:flex;flex-direction:column;overflow:hidden}
.pic{font-size:54px;text-align:center;padding:22px 0;background:var(--bg);border-bottom:1.5px dashed var(--line)}
.info{padding:12px;display:flex;flex-direction:column;gap:4px;flex:1}
.info h2{font-size:14px;margin:0;font-weight:600;line-height:1.3}
.sub{color:var(--muted);font-size:13px}
.price{font-weight:600;margin-top:auto;padding-top:6px}
.add{margin:0 12px 12px;background:var(--tape);color:var(--tapeink);border:0;border-radius:4px;padding:9px;font-weight:600}
.add:active{transform:scale(.97)}
dialog{border:0;border-radius:8px;padding:0;width:min(440px,92vw);max-height:88vh;background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgba(10,15,30,.6)}
.dh{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1.5px solid var(--line)}
.dh h2{margin:0;font-size:18px}
.x{background:none;border:0;font-size:24px;line-height:1}
.items{padding:6px 18px}
.row{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.row .n{flex:1;font-size:14px}
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--ink);background:none}
.empty{padding:26px 18px;color:var(--muted)}
.form{padding:14px 18px 18px;display:grid;gap:10px}
.form input{width:100%;padding:11px;border:1.5px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink);font:inherit}
.total{display:flex;justify-content:space-between;font-weight:600;padding:4px 0}
.order{background:var(--ink);color:var(--bg);border:0;border-radius:4px;padding:13px;font-weight:600}
.order[disabled]{opacity:.4}
footer{padding:22px 18px 30px;border-top:2px solid var(--ink);color:var(--muted);font-size:14px;text-align:center}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header><span class="logo">Xitoycha</span><button class="cartbtn" id="open">Savat<b id="cnt">0</b></button></header>

<section class="hero">
<span class="tape">Xitoydan to‘g‘ridan-to‘g‘ri</span>
<h1 style="margin-top:16px">Xitoy tovarlari, ombordan eshigingizgacha</h1>
<p>Tanlang, buyurtma bering — qolganini biz hal qilamiz. Yetkazish muddati: 12–20 kun.</p>
<div class="stamps"><span class="stamp">Sifat tekshiruvi</span><span class="stamp">Kafolat 14 kun</span><span class="stamp">Oʻzbekiston boʻylab</span></div>
</section>

<nav class="tabs" id="tabs" aria-label="Kategoriyalar"></nav>
<main class="grid" id="grid"></main>

<dialog id="dlg">
<div class="dh"><h2>Savat</h2><button class="x" id="close" aria-label="Yopish">×</button></div>
<div id="items"></div>
<div class="form" id="form">
<div class="total"><span>Jami</span><span id="sum">0 soʻm</span></div>
<input id="name" placeholder="Ismingiz" autocomplete="name">
<input id="phone" placeholder="Telefon: +998 ..." inputmode="tel" autocomplete="tel">
<input id="addr" placeholder="Manzil (shahar, tuman, koʻcha)" autocomplete="street-address">
<button class="order" id="send" disabled>Buyurtma berish</button>
<div class="sub" id="fb" aria-live="polite"></div>
</div>
</dialog>

<footer>© Xitoycha</footer>

<script>

var P=[
{id:1,n:"Simsiz quloqchin",c:"Elektronika",p:89000,e:"🎧"},
{id:2,n:"Smart soat",c:"Elektronika",p:189000,e:"⌚"},
{id:3,n:"Powerbank 20000 mAh",c:"Elektronika",p:159000,e:"🔋"},
{id:4,n:"LED stol chiroqi",c:"Uy-roʻzgʻor",p:75000,e:"💡"},
{id:5,n:"Mini blender",c:"Uy-roʻzgʻor",p:129000,e:"🥤"},
{id:6,n:"Oshxona organayzeri",c:"Uy-roʻzgʻor",p:59000,e:"🧺"},
{id:7,n:"Sport krossovka",c:"Kiyim",p:219000,e:"👟"},
{id:8,n:"Issiq kurtka",c:"Kiyim",p:349000,e:"🧥"},
{id:9,n:"Bolalar konstruktori",c:"Bolalar",p:99000,e:"🧩"},
{id:10,n:"Radioboshqaruv mashina",c:"Bolalar",p:145000,e:"🚗"}
];
var cat="Hammasi",cart={};
var $=function(i){return document.getElementById(i)};
var fmt=function(n){return n.toLocaleString("ru-RU")+" soʻm"};

function tabs(){
  var cs=["Hammasi"].concat(P.map(function(x){return x.c}).filter(function(v,i,a){return a.indexOf(v)===i}));
  $("tabs").innerHTML=cs.map(function(c){return '<button class="tab" aria-pressed="'+(c===cat)+'" data-c="'+c+'">'+c+'</button>'}).join("");
}
function grid(){
  $("grid").innerHTML=P.filter(function(x){return cat==="Hammasi"||x.c===cat}).map(function(x){
    return '<article class="card"><div class="pic" aria-hidden="true">'+x.e+'</div><div class="info"><h2>'+x.n+'</h2><span class="sub">'+x.c+'</span><span class="price">'+fmt(x.p)+'</span></div><button class="add" data-id="'+x.id+'">Savatga qoʻshish</button></article>';
  }).join("");
}
function cartRender(){
  var ids=Object.keys(cart),count=0,sum=0;
  $("items").innerHTML=ids.length?'<div class="items">'+ids.map(function(id){
    var x=P.filter(function(p){return p.id==id})[0],q=cart[id];count+=q;sum+=q*x.p;
    return '<div class="row"><span>'+x.e+'</span><span class="n">'+x.n+'<br><span class="sub">'+fmt(x.p)+'</span></span><span class="qty"><button data-m="'+id+'" aria-label="Kamaytirish">−</button>'+q+'<button data-pl="'+id+'" aria-label="Koʻpaytirish">+</button></span></div>';
  }).join("")+'</div>':'<p class="empty">Savat boʻsh. Mahsulot qoʻshing.</p>';
  $("cnt").textContent=count;$("sum").textContent=fmt(sum);
  $("form").style.display=ids.length?"grid":"none";
  chk();
}
function chk(){$("send").disabled=!(Object.keys(cart).length&&$("name").value.trim()&&$("phone").value.trim().length>=9&&$("addr").value.trim())}

$("tabs").onclick=function(e){var c=e.target.getAttribute("data-c");if(c){cat=c;tabs();grid()}};
$("grid").onclick=function(e){var id=e.target.getAttribute("data-id");if(id){cart[id]=(cart[id]||0)+1;cartRender();e.target.textContent="Qoʻshildi ✓";setTimeout(function(){e.target.textContent="Savatga qoʻshish"},900)}};
$("items").onclick=function(e){
  var m=e.target.getAttribute("data-m"),p=e.target.getAttribute("data-pl");
  if(p)cart[p]++;
  if(m){cart[m]--;if(cart[m]<=0)delete cart[m]}
  cartRender();
};
["name","phone","addr"].forEach(function(i){$(i).oninput=chk});
$("open").onclick=function(){$("dlg").showModal()};
$("close").onclick=function(){$("dlg").close()};
$("send").onclick=function(){
  var items=Object.keys(cart).map(function(id){var x=P.filter(function(p){return p.id==id})[0];return {n:x.n,q:cart[id],p:x.p}});
  var btn=$("send");btn.disabled=true;btn.textContent="Yuborilmoqda...";
  fetch("/api/order",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({name:$("name").value,phone:$("phone").value,addr:$("addr").value,items:items})})
  .then(function(r){if(!r.ok)throw 0;
    cart={};cartRender();$("fb").textContent="";
    $("items").innerHTML='<p class="empty">Buyurtmangiz qabul qilindi. Tez orada siz bilan bogʻlanamiz.</p>';
    $("form").style.display="none";btn.textContent="Buyurtma berish";})
  .catch(function(){$("fb").textContent="Yuborib boʻlmadi. Qayta urinib koʻring yoki Telegram: @abulfayz1";
    btn.textContent="Buyurtma berish";chk();});
};
tabs();grid();cartRender();
</script>
</body>
</html>
